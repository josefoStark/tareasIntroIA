<svg xmlns="http://www.w3.org/2000/svg"
     width="560"
     height="500"
     viewBox="0 0 560 500">

  <!-- Fondo -->
  <rect width="560" height="500" fill="white"/>

  <!-- Título -->
  <text x="300" y="25"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="bold">
    Mundo de Wumpus — Cueva 4×4
  </text>

  <!-- ========================= -->
  <!-- CUADRÍCULA                 -->
  <!-- ========================= -->

  <!-- Marco -->
  <rect x="100" y="60"
        width="400"
        height="400"
        fill="white"
        stroke="black"
        stroke-width="2"/>

  <!-- Líneas verticales -->
  <line x1="200" y1="60" x2="200" y2="460"
        stroke="black" stroke-width="2"/>

  <line x1="300" y1="60" x2="300" y2="460"
        stroke="black" stroke-width="2"/>

  <line x1="400" y1="60" x2="400" y2="460"
        stroke="black" stroke-width="2"/>

  <!-- Líneas horizontales -->
  <line x1="100" y1="160" x2="500" y2="160"
        stroke="black" stroke-width="2"/>

  <line x1="100" y1="260" x2="500" y2="260"
        stroke="black" stroke-width="2"/>

  <line x1="100" y1="360" x2="500" y2="360"
        stroke="black" stroke-width="2"/>


  <!-- ========================= -->
  <!-- NÚMEROS DE COLUMNAS       -->
  <!-- ========================= -->

  <g font-family="Arial, sans-serif"
     font-size="20"
     font-weight="bold"
     text-anchor="middle">

    <text x="150" y="50">1</text>
    <text x="250" y="50">2</text>
    <text x="350" y="50">3</text>
    <text x="450" y="50">4</text>

  </g>


  <!-- ========================= -->
  <!-- NÚMEROS DE FILAS          -->
  <!-- ========================= -->

  <g font-family="Arial, sans-serif"
     font-size="20"
     font-weight="bold"
     text-anchor="middle">

    <text x="70" y="125">4</text>
    <text x="70" y="225">3</text>
    <text x="70" y="325">2</text>
    <text x="70" y="425">1</text>

  </g>


  <!-- ========================= -->
  <!-- ELEMENTOS DE LA CUEVA     -->
  <!-- ========================= -->

  <!-- G = Gold (1,4) -->
  <text x="150" y="135"
        text-anchor="middle"
        font-size="48">💰</text>

  <!-- H = Hueco (1,3) -->
  <text x="150" y="235"
        text-anchor="middle"
        font-size="48">🕳️</text>

  <!-- W = Wumpus (3,3) -->
  <text x="350" y="235"
        text-anchor="middle"
        font-size="48">👹</text>

  <!-- H = Hueco (3,2) -->
  <text x="350" y="335"
        text-anchor="middle"
        font-size="48">🕳️</text>

  <!-- A = Agente (1,1) -->
  <text x="150" y="435"
        text-anchor="middle"
        font-size="48">🧑</text>

  <!-- H = Hueco (4,1) -->
  <text x="450" y="435"
        text-anchor="middle"
        font-size="48">🕳️</text>

</svg>